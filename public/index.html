<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#154273">
    <meta name="description" content="COMMIT Datascience Cell. Producten, team, contact en het AI-leerpad.">
    <meta property="og:title" content="COMMIT Datascience Cell">
    <meta property="og:description" content="Producten, team, contact en het AI-leerpad.">
    <meta property="og:type" content="website">
    <title>COMMIT Datascience Cell</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="./assets/fonts/RO-SansWebText-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/RobotoCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/Orbitron.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./learning/styles.css">
    <script src="./site-config.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./learning/launcher.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#destinations">Ga naar de links</a>
    <header class="site-header">
      <button class="motion-toggle" id="motion-toggle" type="button" aria-label="Pauzeer animatie" title="Pauzeer animatie" aria-pressed="false" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path class="pause-icon" d="M5 3v10M11 3v10"/><path class="play-icon" d="m5 3 7 5-7 5Z"/></svg>
      </button>
    </header>

    <main class="page-width" aria-labelledby="team-name">
      <h1 class="site-title" id="team-name"><span data-name-first>COMMIT</span> <span data-name-rest>Datascience Cell</span></h1>
      <div class="connection-stage" id="connection-stage">
        <svg class="connection-tracks" id="connection-tracks" aria-hidden="true" focusable="false">
          <g data-route="products"><path class="track-base"/><path class="track-pulse"/><circle class="track-end" r="4"/></g>
          <g data-route="team"><path class="track-base"/><path class="track-pulse"/><circle class="track-end" r="4"/></g>
          <g data-route="contact"><path class="track-base"/><path class="track-pulse"/><circle class="track-end" r="4"/></g>
        </svg>

        <section class="identity" aria-labelledby="team-name">
          <svg class="logo-mark" id="logo-mark" viewBox="140 140 1020 960" role="group" aria-labelledby="logo-title logo-description">
            <title id="logo-title">COMMIT Datascience Cell logo</title>
            <desc id="logo-description">Een oranje tandwiel met drie printbanen. Kies de ster in het midden voor het AI-leerpad.</desc>
            <path fill="#ff7106" d="M562 178H687L727 277Q763 287 797 305L895 264L928 343L803 443A253 253 0 1 0 803 802L928 902L895 981L797 940Q763 959 727 968L687 1067H562L522 968Q487 959 452 940L354 981L266 893L307 795Q289 762 279 727L180 685V560L279 520Q289 485 307 450L266 352L354 264L452 305Q486 287 522 277Z"/>
            <a class="learning-star" id="learning-link" data-destination="learning" role="button" tabindex="0" aria-label="AI-leerpad" aria-haspopup="dialog" aria-controls="ai-learning-dialog">
              <title id="learning-link-title">AI-leerpad</title>
              <path class="star-shape" fill="#ff7106" d="M609 463C626 563 636 600 759 625C650 644 628 669 609 789C590 673 565 651 446 626C559 601 589 574 609 463Z"/>
              <text class="star-hint" x="609" y="839" text-anchor="middle" aria-hidden="true">AI-leerpad</text>
            </a>
            <g class="logo-branches" fill="none" stroke="#424547" stroke-width="35" stroke-linejoin="round">
              <path data-branch="0" d="M682 555H865L955 468H1063"/>
              <path data-branch="1" d="M773 626H1063"/>
              <path data-branch="2" d="M682 695H865L955 785H1063"/>
            </g>
            <g fill="#ff7106">
              <circle data-terminal="0" cx="1063" cy="468" r="43"/>
              <circle data-terminal="1" cx="1063" cy="626" r="43"/>
              <circle data-terminal="2" cx="1063" cy="785" r="43"/>
            </g>
          </svg>
        </section>

        <nav class="destinations" id="destinations" aria-label="Bestemmingen" tabindex="-1">
          <span class="destination" data-destination="products" aria-disabled="true"><span class="destination-copy"><strong data-label>Producten</strong><small data-status>Binnenkort beschikbaar</small></span><span class="destination-arrow" aria-hidden="true">↗</span></span>
          <span class="destination" data-destination="team" aria-disabled="true"><span class="destination-copy"><strong data-label>Team</strong><small data-status>Binnenkort beschikbaar</small></span><span class="destination-arrow" aria-hidden="true">↗</span></span>
          <span class="destination" data-destination="contact" aria-disabled="true"><span class="destination-copy"><strong data-label>Contact</strong><small data-status>Binnenkort beschikbaar</small></span><span class="destination-arrow" aria-hidden="true">↗</span></span>
        </nav>
      </div>
    </main>
    <footer class="site-footer" aria-label="Einde van de pagina"></footer>
    <dialog class="ai-quest" id="ai-learning-dialog" aria-labelledby="quest-title">
      <header class="q-header">
        <button class="q-icon" id="quest-home" type="button" aria-label="Kies een spel" title="Kies een spel" hidden>←</button>
        <div class="q-heading"><h2 id="quest-title" tabindex="-1">AI Werkplekavontuur</h2><span id="quest-subtitle">Vijf korte spellen. Handige vaardigheden voor elke dag.</span></div>
        <span class="q-track-score" id="quest-score"></span>
        <button class="q-icon" id="quest-help" type="button" aria-label="Open RICHT-spiekkaart en promptingtechnieken" title="RICHT-spiekkaart">?</button>
        <button class="q-icon" id="quest-close" type="button" aria-label="Sluit het leerpad" title="Sluiten">×</button>
      </header>
      <section class="q-body" id="quest-body" tabindex="0" aria-label="Spelinhoud"><p role="status">Je leerpaneel wordt geopend…</p></section>
      <footer class="q-footer" id="quest-footer"></footer>
      <div class="q-sr-only" id="quest-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
    </dialog>
  </body>
</html>
